name: CI

# Runs on every pull request (to catch problems before merge) and on every
# push to main (to catch anything merged without going through a PR, eg.
# direct pushes or merge commits).
on:
  pull_request:
  push:
    branches: [main]

# The access token GitHub gives this workflow can only read the repo's code.
# This job never writes anything back to GitHub (no pushes, comments or
# releases), so it shouldn't be able to. The repo's default setting is
# already read-only, but stating it here keeps it read-only even if that
# setting is changed later.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Third-party actions are pinned to an exact commit ID, not a version
    # label like `@v7`. A label can be moved by whoever controls the action's
    # repo to point at different code; a commit ID can't, so CI only ever
    # runs the code that was reviewed. The `# vX.Y.Z` comment on the same
    # line records which version that commit is - keep it on the same line,
    # because Dependabot updates both the commit ID and the comment together.
    #
    # v7 of both actions runs on Node 24. The older v4 releases ran on
    # Node 20, which GitHub is retiring from its runners.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By default, checkout leaves the job's access token on the machine
          # after cloning, where every later step can read it - including
          # the install scripts of any npm package. Nothing after this step
          # needs git access (installing, linting and building only read
          # files), so don't keep the token around.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep this in lockstep with the local dev/Netlify Node version
          # instead of hardcoding it here twice.
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` (not `npm install`) so CI installs exactly what's in
      # package-lock.json and fails if the lockfile is out of sync.
      - name: Install dependencies
        run: npm ci

      # ESLint (with the Prettier plugin) covers all .js/.mjs source files.
      - name: Lint scripts
        run: npm run lint:scripts

      # markdownlint covers the Markdown content under src/.
      - name: Lint markdown
        run: npm run lint:markdown

      # Belt-and-braces Prettier check, scoped to js/mjs to match what
      # lint:scripts already covers - Markdown/SCSS aren't Prettier-formatted
      # project-wide yet, so checking them here would fail on unrelated files.
      - name: Check formatting
        run: npm run format:check

      # Full production build (styles, scripts, then Eleventy) - catches
      # build-breaking errors (bad templates, missing data, etc.) before merge.
      - name: Build
        run: npm run build
