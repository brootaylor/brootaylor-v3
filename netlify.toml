##############################
# Build settings
##############################

[build]
  base = "/"
  publish = "dist"
  command = "npm run deploy:build"

  # Netlify post-processing. Only Pretty URLs is still supported; Netlify ended
  # CSS/JS bundling, minification and image compression in Oct 2023.
  # https://docs.netlify.com/build/post-processing/overview/
  [build.processing]
    skip_processing = false
  [build.processing.html]
    pretty_urls = true

# Environment for `production` builds (Node version comes from .nvmrc)
[context.production.environment]
  NODE_ENV = "production"
  TZ = "Europe/London"


##############################
# Netlify dev server (local)
##############################

# Dev settings: (Used when running local Netlify dev server)
[dev]
  command = "npm run dev"
  port = 8888 # Declaring port for netlify dev server to use when running the `npm run dev` command
  targetPort = 8080 # The port for my application server, framework or site generator
  publish = "dist" # The path to my static content folder
  autoLaunch = true # A boolean value that determines if Netlify Dev launches the local server address in the browser
  framework = "#custom" # Runs `command` as the app server and connects to it on `targetPort`. Required when both are set.
  # envFiles = [".env"] # The env files to use, ordered by priority (left - highest, right - lowest)


##############################
# Netlify plugins
##############################

# Local Lighthouse plugin - audits `dist/` after the build and shows the scores in the Netlify UI.
# Informational only: never fails the build. (See `netlify/plugins/lighthouse/index.js`)
[[plugins]]
  package = "/netlify/plugins/lighthouse"


##############################
# Headers
##############################

# Headers (Global)
[[headers]]
  # Define which paths this specific [[headers]] block will cover.
  for = "/*"

  [headers.values]
    # Controls where scripts, styles, plugins and images may load from.
    # - 'unsafe-inline' is only meaningful for script-src and style-src, so it isn't used in img-src.
    # - img-src allows this site plus CloudFront-hosted images, YouTube thumbnails (ytimg)
    #   and the 11ty IndieWeb avatar service.
    Content-Security-Policy = "script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; img-src 'self' *.cloudfront.net *.ytimg.com *.indieweb-avatar.11ty.dev"

    # Same-origin requests get the full URL; cross-origin requests get only the origin
    # (e.g. https://brootaylor.com), and nothing is sent when going from HTTPS to HTTP.
    # Use "no-referrer" instead to stop sending a referrer to other sites altogether.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Blocks these browser features for this site and any embedded iframes.
    # Note: 'interest-cohort' (Google's retired FLoC opt-out) was removed, as browsers no
    # longer recognise it and Chrome logs a console warning when it's present.
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

    # Tells browsers to only use HTTPS for this domain and its subdomains for 1 year.
    # 'preload' makes the domain eligible for the browser HSTS preload list (hstspreload.org).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Stops browsers guessing (sniffing) a file's type, so they use the declared Content-Type.
    X-Content-Type-Options = "nosniff"

    # Only lets this site embed its own pages in frames, which protects against clickjacking.
    X-Frame-Options = "SAMEORIGIN"

# Header for .ico files
[[headers]]
  for = "/*.ico"
  [headers.values]
    Content-Type = "image/x-icon"

# Header for 'normal' JS
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Header for ES6 Modules
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Header for JSON
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"


##############################
# Redirects
##############################

## ########################################################################
# Redirect rule to point temporary Netlify URL to preferred domain name
# ========================================================================
# NOTE: This requires the DNS records to be updated to point to Netlify.
[[redirects]]
  from = "https://brootaylor-eleventy.netlify.app/*"
  to = "https://brootaylor.com/:splat"
  status = 301
  force = true

# ########################################################################
# Site-specific page redirects
# ========================================================================
# 404 pages
[[redirects]]
  from = "/*"
  to = "/error/404"
  status = 404

# ========================================================================
# NOTE: Using `_redirects-production.njk` file - (compiles to `_redirects`) - to handle page level redirects cause doesn't seem to work properly in this .toml config file for some reason.
# ========================================================================
